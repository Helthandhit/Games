<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>George's Game Hub</title>
<style>html,*{-webkit-tap-highlight-color:transparent!important;-webkit-tap-highlight-color:rgba(0,0,0,0)!important;-webkit-touch-callout:none}*:focus,*:focus-visible{outline:none!important}button,a,canvas{user-select:none;-webkit-user-select:none}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh;background:radial-gradient(circle at top,#1a0b3a,#05050f 70%);color:#fff;font-family:system-ui,sans-serif}
h1{text-align:center;font-size:clamp(32px,8vw,64px);margin:40px 10px 8px;color:#0ff;text-shadow:0 0 10px #0ff,0 0 30px #f0f;letter-spacing:2px;font-style:italic}
p.sub{text-align:center;color:#c9f;margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;max-width:1000px;margin:0 auto;padding:0 18px 40px}
.card{background:#111428;border:2px solid #0ff;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 0 18px #0ff5;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 0 30px #f0f}
.card img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ph{background:repeating-linear-gradient(45deg,#222 0 12px,#1a1a1a 12px 24px);display:flex;align-items:center;justify-content:center;font-size:40px}
.card h2{margin:12px 14px 4px;font-size:22px}.card span{display:block;margin:0 14px 14px;color:#9ab}
.card.hh{border-color:#ff1a1a;background:#0b0b0b;box-shadow:0 0 18px #ff1a1a66}.card.hh:hover{box-shadow:0 0 30px #ff1a1a}.card.hh h2{color:#ff3b3b}
.card.cake{border-color:#ff9ec4;background:#2a1626;box-shadow:0 0 18px #ff9ec466}.card.cake:hover{box-shadow:0 0 30px #ff9ec4}.card.cake h2{color:#ffb3d1}
.soon{filter:grayscale(1);opacity:.5;border-color:#555;box-shadow:none;pointer-events:none}.daily{max-width:1000px;margin:0 auto 26px;padding:0 18px;display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:18px}
@media(max-width:640px){.daily{grid-template-columns:1fr}}
.pan{background:#0b0b0b;border:2px solid #e10600;border-radius:16px;box-shadow:0 0 18px #e1060055;padding:16px 18px}
.streak{display:flex;align-items:center;gap:14px}.streak .fl{font-size:54px;filter:drop-shadow(0 0 10px #e10600)}.streak b{font:900 44px system-ui;color:#fff;line-height:1}.streak small{display:block;color:#ff5a4f;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.streak .hint{color:#aaa;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;margin-top:4px}
.dc h3{margin:0 0 6px;color:#ff3b30;font:900 15px system-ui;letter-spacing:2px}.dc p{margin:0 0 12px;font:800 20px system-ui}
.dc .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.st{padding:6px 12px;border-radius:20px;font-weight:800;font-size:14px;border:2px solid #555;color:#bbb}
.st.ok{background:#e10600;border-color:#e10600;color:#fff}.go{background:#e10600;color:#fff;text-decoration:none;font-weight:900;padding:9px 16px;border-radius:10px;box-shadow:0 0 12px #e1060088}.dc .gm{color:#aaa;font-size:13px}
</style></head><body>
<h1>George's Game Hub</h1><p class="sub">Pick a game and hit the gas 🏁</p>
<div class="daily"><div class="pan streak" id="streak"><span class="fl">🔥</span><div><b id="sCount">0</b><small id="sLabel">day streak</small><div class="hint" id="sHint"></div></div></div>
<div class="pan dc"><h3>⚡ DAILY CHALLENGE</h3><p id="dText"></p><div class="row"><span class="st" id="dState"></span><a class="go" id="dGo" href="#">Play ▶</a><span class="gm" id="dGame"></span></div></div></div>
<div class="grid">
<a class="card" href="turbo-run/"><img src="turbo-run/menu.png" alt="PaddockScan"><h2>PaddockScan</h2><span>Dodge traffic, grab coins, chain near misses</span></a>
<a class="card hh" href="healthandhit/"><img src="healthandhit/menu.png" alt="HealthAndHIT"><h2>HealthAndHIT</h2><span>Lift, sprint and level up your gym hero</span></a>
<a class="card cake" href="cake/"><img src="cake/menu.png" alt="Sprinkles and Layers"><h2>Sprinkles and Layers</h2><span>Bake, frost &amp; decorate cakes for picky customers</span></a>
</div><script src="daily.js"></script><script>
function renderDaily(){const D=window.GHDaily;if(!D)return;const s=D.streak(),d=D.daily();
 document.getElementById('sCount').textContent=s.count;document.getElementById('sLabel').textContent=(s.count===1?'day':'days')+' streak';
 document.getElementById('sHint').textContent=s.playedToday?'Played today ✔':(s.count?'Play today to keep it going!':'Play any game to start a streak');
 document.getElementById('dText').textContent=d.text;const st=document.getElementById('dState');st.textContent=d.done?'✔ Done':'○ Not done';st.className='st'+(d.done?' ok':'');
 const g=document.getElementById('dGo');g.href=d.url;g.textContent=(d.done?'Play again':'Play')+' '+d.gameName+' ▶';document.getElementById('dGame').textContent='New challenge at midnight';renderDaily.day=d.date}
renderDaily();addEventListener('pageshow',renderDaily);addEventListener('focus',renderDaily);document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderDaily()});
setInterval(()=>{if(window.GHDaily&&GHDaily.today()!==renderDaily.day)renderDaily()},30000);
</script><div style="position:fixed;bottom:4px;right:8px;font:11px system-ui;color:#fff6;pointer-events:none">v1.8.2</div></body></html>
